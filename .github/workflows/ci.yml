name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} test suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify every source file parses
        run: |
          find src tests -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test
